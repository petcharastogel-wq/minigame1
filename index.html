<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>미니게임 — 네온 러너</title>
<style>
:root{color-scheme:dark;--bg:#070910;--panel:#101522;--line:#232d43;--cyan:#45f3ff;--pink:#ff4fd8;--lime:#c7ff5e;--muted:#9aa7bd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f7ff;font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans KR",sans-serif}body{display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#101c36 0%,#070910 60%)}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{width:min(900px,100%);background:#080c15;border:1px solid #1d2940;border-radius:24px;padding:clamp(16px,3vw,28px);box-shadow:0 0 55px #00d9ff0b;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border:1px solid #45f3ff77;border-radius:13px;display:grid;place-items:center;color:var(--cyan);font-size:23px;box-shadow:inset 0 0 18px #45f3ff14,0 0 20px #45f3ff12}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.22em;font-weight:800}.brand h1{font-size:clamp(22px,4vw,30px);line-height:1.1;margin:4px 0 0;letter-spacing:-.04em}.pill{border:1px solid #26334c;border-radius:99px;padding:8px 12px;color:#b7c4d9;font-size:12px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:#0d1320;border:1px solid #1d2940;border-radius:13px;padding:12px 14px}.stat span{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.stat strong{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}.game-wrap{position:relative;border:1px solid #24314b;border-radius:16px;overflow:hidden;background:#050812;box-shadow:inset 0 0 45px #111c35}.game-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#050812c9;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.orb{width:64px;height:64px;border:1px solid #45f3ff88;border-radius:20px;display:grid;place-items:center;color:var(--cyan);font-size:30px;box-shadow:0 0 32px #45f3ff25,inset 0 0 22px #45f3ff16;margin-bottom:14px}.overlay h2{font-size:clamp(24px,4vw,36px);margin:0 0 8px;letter-spacing:-.04em}.overlay p{color:#b5c1d4;line-height:1.65;margin:0 0 18px;max-width:390px;font-size:14px}.primary{border:0;border-radius:12px;padding:13px 24px;font-weight:900;color:#061017;background:var(--cyan);box-shadow:0 0 25px #45f3ff32;transition:transform .15s,filter .15s}.primary:hover{filter:brightness(1.12);transform:translateY(-1px)}.help{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:15px;color:#9aa7bd;font-size:12px}.keys{display:flex;gap:6px;align-items:center}.key{border:1px solid #2a3650;background:#111827;color:#e8f3ff;border-radius:6px;min-width:25px;text-align:center;padding:4px 7px;font-size:11px}.controls{display:none;gap:12px;margin-top:12px}.controls button{flex:1;border:1px solid #2a3650;background:#111827;color:var(--cyan);border-radius:12px;padding:13px;font-weight:800}.footer{margin-top:16px;text-align:center;color:#58677f;font-size:11px;letter-spacing:.06em}
@media(max-width:540px){body{padding:10px}#app{border-radius:18px;padding:13px}.pill{font-size:10px;padding:7px 9px}.stat{padding:9px 10px}.stat strong{font-size:21px}.controls{display:flex}.help{font-size:11px}.help .keys{display:none}}
</style>
</head>
<body>
<main id="app">
 <header class="top"><div class="brand"><div class="logo">✦</div><div><div class="eyebrow">ARCADE / 001</div><h1>미니게임 <span style="color:var(--cyan)">.</span></h1></div></div><div class="pill">NEON RUNNER · 무한 도전</div></header>
 <section class="stats" aria-label="게임 기록"><div class="stat"><span>현재 점수</span><strong id="score">0000</strong></div><div class="stat"><span>최고 기록</span><strong id="best">0000</strong></div><div class="stat"><span>속도</span><strong id="speed">1.0<span style="font-size:12px;color:#9aa7bd">x</span></strong></div></section>
 <div class="game-wrap"><canvas id="game" width="960" height="540" aria-label="장애물 피하기 게임 화면"></canvas>
  <div class="overlay" id="overlay"><div class="orb">↗</div><h2 id="overlayTitle">준비됐어?</h2><p id="overlayText">네온 장애물을 피해 최대한 오래 버텨봐.<br>좌우 방향키 또는 A / D 키로 움직여!</p><button class="primary" id="start">게임 시작하기&nbsp; →</button></div>
 </div>
 <div class="controls"><button id="left" aria-label="왼쪽으로 이동">← 왼쪽</button><button id="right" aria-label="오른쪽으로 이동">오른쪽 →</button></div>
 <div class="help"><div class="keys"><span class="key">←</span><span class="key">→</span><span style="margin:0 4px">또는</span><span class="key">A</span><span class="key">D</span><span style="margin-left:5px">이동</span></div><span>장애물에 닿으면 게임 오버 · 기록은 이 기기에 저장돼</span></div>
 <div class="footer">STAY SHARP · DODGE THE GLOW</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),speedEl=document.getElementById('speed');
const overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText'),startBtn=document.getElementById('start');
let state='ready',player={x:480,y:455,w:34,h:38,vx:0},obstacles=[],particles=[],stars=[],score=0,best=0,elapsed=0,last=0,spawn=0,keys={left:false,right:false},speed=1;
try{best=Number(localStorage.getItem('neonRunnerBest')||0)}catch(e){}bestEl.textContent=String(best).padStart(4,'0');
for(let i=0;i<90;i++)stars.push({x:Math.random()*960,y:Math.random()*540,r:Math.random()*1.8+.3,a:Math.random()*.6+.15});
function reset(){score=0;elapsed=0;spawn=0;speed=1;obstacles=[];particles=[];player.x=480;player.vx=0;scoreEl.textContent='0000';speedEl.innerHTML='1.0<span style="font-size:12px;color:#9aa7bd">x</span>';}
function start(){reset();state='playing';overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function end(){state='over';if(score>best){best=score;bestEl.textContent=String(best).padStart(4,'0');try{localStorage.setItem('neonRunnerBest',String(best))}catch(e){}}overlayTitle.textContent='GAME OVER';overlayText.innerHTML='최종 점수는 <b style="color:#45f3ff">'+score+'</b>점!<br>다시 도전해서 최고 기록을 갱신해봐.';startBtn.textContent='다시 도전하기  ↻';overlay.classList.remove('hidden')}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){const W=960,H=540;ctx.clearRect(0,0,W,H);ctx.fillStyle='#050812';ctx.fillRect(0,0,W,H);
 const grad=ctx.createRadialGradient(480,210,10,480,270,600);grad.addColorStop(0,'#101a32');grad.addColorStop(1,'#050812');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#8beeff';ctx.fillRect(s.x,s.y,s.r,s.r)});ctx.globalAlpha=1;
 ctx.strokeStyle='#1b2c47';ctx.lineWidth=1;for(let x=0;x<=W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle='#45f3ff26';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(30,H);ctx.moveTo(W-30,0);ctx.lineTo(W-30,H);ctx.stroke();
 obstacles.forEach(o=>{ctx.save();ctx.shadowBlur=24;ctx.shadowColor=o.color;ctx.fillStyle=o.color;roundedRect(o.x,o.y,o.w,o.h,7);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.globalAlpha=.45;roundedRect(o.x+5,o.y+4,Math.max(2,o.w-10),3,2);ctx.globalAlpha=1;ctx.restore()});
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
 ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=25;ctx.shadowColor='#45f3ff';ctx.fillStyle='#45f3ff';ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(18,13);ctx.lineTo(0,7);ctx.lineTo(-18,13);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f4ffff';ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(6,3);ctx.lineTo(-6,3);ctx.closePath();ctx.fill();ctx.restore();
 if(state!=='playing'){ctx.fillStyle='#45f3ff';ctx.globalAlpha=.5;ctx.fillRect(0,500,W,1);ctx.globalAlpha=1}
}
function loop(now){if(state!=='playing')return;const dt=Math.min((now-last)/16.67,2);last=now;elapsed+=dt;speed=1+Math.min(elapsed/1000,2.2);score=Math.floor(elapsed/5);scoreEl.textContent=String(score).padStart(4,'0');speedEl.innerHTML=speed.toFixed(1)+'<span style="font-size:12px;color:#9aa7bd">x</span>';
 const move=(keys.right?1:0)-(keys.left?1:0);player.vx+=(move*1.15-player.vx*.13)*dt;player.x+=player.vx*dt*4.5;player.x=Math.max(58,Math.min(902,player.x));
 spawn+=dt;if(spawn>Math.max(19,47-elapsed/100)){spawn=0;const w=38+Math.random()*62;obstacles.push({x:65+Math.random()*(830-w),y:-35,w,h:20+Math.random()*22,color:Math.random()>.5?'#ff4fd8':'#c7ff5e',v:(3.4+Math.random()*1.7)*speed})}
 obstacles.forEach(o=>o.y+=o.v*dt);obstacles=obstacles.filter(o=>o.y<570);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.025*dt});particles=particles.filter(p=>p.life>0);
 for(const o of obstacles){if(Math.abs(o.x+o.w/2-player.x)<o.w/2+11&&Math.abs(o.y+o.h/2-player.y)<o.h/2+14){for(let i=0;i<28;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:1,color:i%2?'#45f3ff':'#ff4fd8'});draw();end();return}}
 draw();requestAnimationFrame(loop)}
startBtn.addEventListener('click',start);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if((e.key===' '||e.key==='Enter')&&state!=='playing')start()});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false});
function hold(btn,key){btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;btn.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>keys[key]=false))}hold(document.getElementById('left'),'left');hold(document.getElementById('right'),'right');
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*960;keys.left=x<player.x;keys.right=x>=player.x});canvas.addEventListener('pointerup',()=>{keys.left=false;keys.right=false});canvas.addEventListener('pointercancel',()=>{keys.left=false;keys.right=false});
draw();
})();
</script>
</body>
</html>
